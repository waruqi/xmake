name: Bug Report
description: Create a report to help us improve
labels: 'bug :beetle:'
body:

- type: input
  attributes:
    label: Xmake Version
    description: What version of Xmake are you using?
    placeholder: 0.0.0
  validations:
    required: true

- type: dropdown
  attributes:
    label: What operating system are you using?
    options:
      - Windows
      - macOS
      - Ubuntu
      - Other Linux
      - Other (specify below)
  validations:
    required: true

- type: input
  attributes:
    label: Operating System Version
    description: What operating system version are you using? On Windows, click Start button > Settings > System > About. On macOS, click the Apple Menu > About This Mac. On Linux, use lsb_release or uname -a.
    placeholder: "e.g. Windows 10 version 1909, macOS Catalina 10.15.7, or Ubuntu 20.04"
  validations:
    required: true
- type: dropdown
  attributes:
    label: What arch are you using?
    options:
      - x64
      - ia32
      - arm64 (including Apple Silicon)
      - Other (specify below)
  validations:
    required: true

- type: textarea
  attributes:
    label: Describe Bug
    description: A clear and concise description of what the bug is.
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected Behavior
    description: A clear and concise description of what you expected to happen.
  validations:
    required: true

- type: textarea
  attributes:
    label: Project Configuration
    description: If possible, please provide your configuration in xmake.lua if possible. Or provide a complete minimal reproducible example project and upload it as an attachment.

- type: textarea
  attributes:
    label: Error Output
    description: If applicable, please add verbose the errors output to help us analyze your problem. If it is a xmake related compilation problem, please add the `-v -D` parameter and give the detailed compilation output information.

- type: textarea
  attributes:
    label: Additional Information
    description: If your problem needs further explanation, or if the issue you're seeing cannot be reproduced in a gist, please add more information here.
